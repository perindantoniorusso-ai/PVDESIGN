for(var i=0;i<P.length;i++){var j=(i+1)%P.length;ar+=P[i][0]*P[j][1]-P[j][0]*P[i][1]}
var u0=Math.min.apply(0,U),v0=Math.min.apply(0,V),nu=Math.ceil((Math.max.apply(0,U)-u0)/su),nv=Math.ceil((Math.max.apply(0,V)-v0)/sv),cs=[];
